# Full local stack: PostgreSQL + Spring Boot backend + React frontend (nginx).
# Usage: copy .env.example to .env (optional — defaults work out of the box), then:
#   docker compose up --build

name: leetcode-tracker

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leetcode_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-leetcode_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leetcode_tracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-leetcode_tracker}
      APP_DB_USERNAME: ${POSTGRES_USER:-leetcode_tracker}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:-leetcode_tracker}
      APP_FLYWAY_ENABLED: ${APP_FLYWAY_ENABLED:-true}
      APP_SERVER_PORT: 8080
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-80}}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-dev-only-jwt-secret-change-me-0123456789abcdef}
      APP_JWT_ACCESS_TTL_SECONDS: ${APP_JWT_ACCESS_TTL_SECONDS:-900}
      APP_JWT_REFRESH_TTL_DAYS: ${APP_JWT_REFRESH_TTL_DAYS:-30}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

  # Optional local SMTP + web UI for testing emails. Enable with:
  #   docker compose --profile mail up
  maildev:
    image: maildev/maildev:2.1.0
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "${MAILDEV_WEB_PORT:-1080}:1080"
      - "${MAILDEV_SMTP_PORT:-1025}:1025"

volumes:
  postgres-data:
