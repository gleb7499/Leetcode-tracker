spring:
  application:
    name: leetcode-tracker-backend
  session:
    jdbc:
      initialize-schema: never
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

server:
  port: 0

app:
  cors:
    origins: http://localhost:5173
  jwt:
    secret: test-only-jwt-secret-with-enough-entropy-0123456789abcdef
    access-ttl: 900s
    refresh-ttl: 30d
  mail:
    host: ""
    port: 587
    username: ""
    password: ""
    from: test@localhost
  otp:
    ttl: 10m
    max-attempts: 5
